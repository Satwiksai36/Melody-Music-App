<script>
  (() => {
    const statuses = [
      "Tuning your acoustic experience...",
      "Calibrating multi-channel soundstage...",
      "Connecting to 48kHz lossless stream...",
      "Harmonizing daily Telugu & Hindi charts...",
      "Ready to play."
    ];
    let step = 0;
    const textEl = document.getElementById("splashStatusText");
    const barEl = document.getElementById("splashProgressBar");

    const interval = setInterval(() => {
      step++;
      if (step < statuses.length) {
        if (textEl) {
          textEl.style.opacity = "0.2";
          setTimeout(() => {
            textEl.textContent = statuses[step];
            textEl.style.opacity = "1";
          }, 200);
        }
        if (barEl) {
          const percentages = ["32%", "56%", "78%", "94%", "100%"];
          barEl.style.width = percentages[step];
        }
      } else {
        clearInterval(interval);
      }
    }, 900);
  })();
